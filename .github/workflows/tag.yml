name: tag

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vMAJOR.MINOR.PATCH (e.g., v1.0.0)"
            exit 1
          fi
          echo "sha=$(git rev-list -n 1 "$TAG_NAME")" >> "$GITHUB_OUTPUT"

      - name: Update README pin
        run: |
          sed -Ei "s|brutasse/setup-rig@[A-Za-z0-9._/-]+( *#[^\n]*)?|brutasse/setup-rig@${TAG_SHA} # ${TAG_NAME}|g" README.md
        env:
          TAG_SHA: ${{ steps.tag.outputs.sha }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "README pin already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: pin README to ${{ github.ref_name }}"
          git push
