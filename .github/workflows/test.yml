name: test

on:
  push:
  pull_request:

jobs:
  bundle-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Committed bundle is the current build
        # The runner executes dist/, and dependency PRs cannot rebuild it; ncc
        # output is byte-deterministic, so anything dirty here is a stale bundle.
        run: |
          dirty=$(git status --porcelain -- dist)
          if [ -n "$dirty" ]; then
            echo "::error::dist/ is stale; run npm ci && npm run build and commit dist/:"
            echo "$dirty"
            exit 1
          fi

  install-and-cache:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provide a lockfile to key the cache on
        run: printf '{:artifacts {}}\n' > deps.lock

      - name: Setup rig (install + cache)
        id: setup
        uses: ./
        with:
          version: v0.1.0
          token: ${{ github.token }}
          enable-cache: true

      - name: Verify install
        run: |
          command -v rig
          rig --version

      - name: Show outputs
        run: |
          echo "rig-version=${{ steps.setup.outputs.rig-version }}"
          echo "cache-hit=${{ steps.setup.outputs.cache-hit }}"

  default-version:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: this job is the pinned default. Both OSes, because the
      # digests in src/rig-version.js are per-asset, and a wrong one must fail
      # here instead of in a consumer's job.
      - name: Setup rig (pinned default)
        id: setup
        uses: ./
        with:
          enable-cache: false

      - name: The installed rig is the pinned release
        run: |
          pin=$(sed -nE "s/^export const defaultRigVersion = '([^']+)'.*/\1/p" src/rig-version.js)
          test -n "$pin"
          test '${{ steps.setup.outputs.rig-version }}' = "$pin"
          # rig --version also advertises newer releases; only its first line
          # reports what is installed.
          test "$(rig --version | head -1)" = "rig version $pin"

  pinned-jvm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provide a lockfile pinning the JVM and GraalVM
        run: |
          cat > deps.lock <<'EOF'
          {"version": 2, "tool": {"name": "rig", "version": "v0.3.1"}, "jvm": {"vendor": "temurin", "requested": "17"}, "graalvm": {"vendor": "graalvm", "requested": "17"}}
          EOF
          # A second lock in a module dir: off-root and multiple locks, matched by glob.
          mkdir -p services/api
          cp deps.lock services/api/deps.lock

      - name: Setup rig (install + cache + pinned toolchain)
        id: setup
        uses: ./
        with:
          # v0.3.1 fixes the managed installs on macOS (bundle-layout home
          # resolution); the path commands behind java-home/graalvm-home
          # landed in v0.3.0.
          version: v0.3.1
          token: ${{ github.token }}
          enable-cache: true
          lockfile: |
            deps.lock
            services/*/deps.lock

      - name: Show outputs
        run: |
          echo "jvm-version=${{ steps.setup.outputs.jvm-version }}"
          echo "graalvm-version=${{ steps.setup.outputs.graalvm-version }}"
          echo "java-home=${{ steps.setup.outputs.java-home }}"
          echo "graalvm-home=${{ steps.setup.outputs.graalvm-home }}"

      - name: Verify the managed toolchain installs
        run: |
          rig jvm list
          rig graalvm list
          rig jvm list | grep -q 'temurin 17'
          rig graalvm list | grep -q 'graalvm 17'
          test -n '${{ steps.setup.outputs.java-home }}'
          test -x '${{ steps.setup.outputs.java-home }}/bin/java'
          test -n '${{ steps.setup.outputs.graalvm-home }}'
          test -x '${{ steps.setup.outputs.graalvm-home }}/bin/native-image'
